<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login complete - Blocky What-Ifs</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; line-height: 1.6; color: #1a1a1a; }
    code { background: #f1f1f1; padding: 0.15rem 0.4rem; border-radius: 4px; word-break: break-all; }
    pre { background: #f1f1f1; padding: 0.8rem; border-radius: 6px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>TikTok login</h1>
  <p id="msg">Reading login response…</p>
  <pre id="cmd" hidden></pre>
  <p><small>This page runs entirely in your browser. The code is shown here only and is not sent anywhere.</small></p>
  <script>
    var q = new URLSearchParams(location.search);
    var msg = document.getElementById('msg');
    var cmd = document.getElementById('cmd');
    var code = q.get('code');
    if (code) {
      msg.textContent = 'Login approved. Run this command in the project folder to finish:';
      cmd.hidden = false;
      cmd.textContent = 'npm run auth -- --code=' + code;
    } else if (q.get('error')) {
      msg.textContent = 'TikTok returned an error: ' + q.get('error') + (q.get('error_description') ? ' - ' + q.get('error_description') : '');
    } else {
      msg.textContent = 'No login code in this URL. Start the login from the command line with: npm run auth';
    }
  </script>
</body>
</html>
